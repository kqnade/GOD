[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "god-discord-bot"
version = "0.1.0"
description = "A local, retrieval-based Discord bot that learns from opted-in conversations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["discord", "bot", "japanese", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: No Input/Output (Daemon)",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "discord.py==2.7.1",
  "Janome==0.5.0",
  "Pillow==12.3.0",
  "qrcode==8.2",
]

[dependency-groups]
dev = [
  "ruff==0.16.10",
]

[project.scripts]
god-bot = "god_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
god_bot = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
