name: Tests

on:
  push:
    branches: ["trunk"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0" # renovate: datasource=github-releases depName=astral-sh/uv
          enable-cache: true

      - name: Install project
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" python -m unittest discover -s tests -v

      - name: Run lint
        run: uv run --python "${{ matrix.python-version }}" ruff check .
